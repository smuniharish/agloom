[project]
name = "agloom-qa-customer-chatbot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agentbarrier>=1.1.0,<2",
  "agloom",
  "behaviorweave>=1.0.0,<2",
  "fastapi>=0.142.2,<1",
  "feedback-manager>=0.1.1,<0.2",
  "langchain-core>=1.6.6,<2",
  "langchain-openai>=1.6.7,<2",
  "prometheus-client>=0.26.0,<1",
  "pydantic>=2.13.5,<3",
  "uvicorn>=0.54.0,<1",
  "xstructured>=0.1.1,<0.2",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "pytest>=9.1.1,<10",
  "python-dotenv>=1.2.4,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
agloom = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = [
  "live: calls the real model configured by EXPLABS_* (run with -m live)",
]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
]
