services:
  backend:
    build:
      context: ../..
      dockerfile: examples/qa_customer_chatbot/backend.Containerfile
    environment:
      EXPLABS_API_KEY: ${EXPLABS_API_KEY:?Set EXPLABS_API_KEY}
      EXPLABS_BASE_URL: ${EXPLABS_BASE_URL:-https://api.experientiallabs.ai/v1}
      EXPLABS_MODEL: ${EXPLABS_MODEL:-gpt-5.6-luna}
      REVIEW_TOKEN: ${REVIEW_TOKEN:-local-review-token}
    ports:
      - "8102:8000"

  frontend:
    build:
      context: ../..
      dockerfile: examples/qa_customer_chatbot/frontend.Containerfile
    depends_on:
      - backend
    ports:
      - "3102:80"
