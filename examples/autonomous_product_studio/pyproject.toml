[project]
name = "agloom-autonomous-product-studio"
version = "0.1.0"
description = "Bounded full-stack software-building loop powered by Agloom"
requires-python = ">=3.12"
dependencies = [
  "agentbarrier>=1.1.0,<2",
  "agloom[postgres-binary]",
  "alembic>=1.20.0,<2",
  "contextsage>=1.0.0,<2",
  "fastapi>=0.142.2,<1",
  "httpx>=0.28.1,<1",
  "langchain>=1.4.3,<2",
  "langchain-core>=1.6.6,<2",
  "langchain-openai>=1.6.7,<2",
  "langgraph>=1.2.13,<2",
  "langgraph-checkpoint-postgres>=3.1.2,<4",
  "mcp-capability-router>=0.2.0,<0.3",
  "pgvector>=0.5.0,<1",
  "procrastinate>=3.10.0,<4",
  "prometheus-client>=0.26.0,<1",
  "psycopg[pool]>=3.3.6,<4",
  "pydantic>=2.13.5,<3",
  "pyjwt[crypto]>=2.15.1,<3",
  "sqlalchemy>=2.1.3,<3",
  "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-timeout>=2.4.0,<3",
  "python-dotenv>=1.2.4,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
agloom = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
timeout = 300
markers = [
  "postgres: needs PostgreSQL with pgvector (TEST_DATABASE_URL or a local Docker engine)",
]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["frontend", "workspace"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120