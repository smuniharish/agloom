services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    ports: ["127.0.0.1:8088:8080"]
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.8
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      OIDC_DEMO_USERNAME: ${OIDC_DEMO_USERNAME:?Set OIDC_DEMO_USERNAME}
      OIDC_DEMO_PASSWORD: ${OIDC_DEMO_PASSWORD:?Set OIDC_DEMO_PASSWORD}
      OIDC_DEMO_TENANT: ${OIDC_DEMO_TENANT:?Set OIDC_DEMO_TENANT}
    volumes: ["../keycloak:/bootstrap:ro"]
    depends_on: [keycloak]
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: agloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: product_studio
    ports: ["127.0.0.1:55435:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agloom -d product_studio"]
      interval: 5s
      timeout: 3s
      retries: 30
    # PostgreSQL 18 images keep PGDATA in /var/lib/postgresql/18/docker.
    volumes: [studio-postgres:/var/lib/postgresql]
  ollama:
    image: ollama/ollama:0.34.4
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; sleep 3; ollama pull all-minilm; wait $$pid"]
    healthcheck:
      test: ["CMD", "ollama", "show", "all-minilm"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes: [studio-ollama:/root/.ollama]
  target-preview:
    image: nginx:1.30-alpine
    volumes: [./target:/usr/share/nginx/html:ro]
  migrate:
    build:
      context: ../..
      dockerfile: examples/autonomous_product_studio/backend/Containerfile
    command: ["python", "-m", "backend.migrate"]
    environment:
      DATABASE_URL: "postgresql://agloom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/product_studio"
      STUDIO_BACKFILL_TENANT_ID: ${STUDIO_BACKFILL_TENANT_ID:-}
      STUDIO_BACKFILL_USER_ID: ${STUDIO_BACKFILL_USER_ID:-}
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build:
      context: ../..
      dockerfile: examples/autonomous_product_studio/backend/Containerfile
    environment:
      DATABASE_URL: "postgresql://agloom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/product_studio"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: all-minilm
      AGLOOM_OBSERVABILITY_ENABLED: "true"
      AGLOOM_METRICS_HOST: 0.0.0.0
      AGLOOM_METRICS_PORT: 9469
      OIDC_ISSUER: http://localhost:8088/realms/agloom
      OIDC_AUDIENCE: product-studio
      OIDC_JWKS_URI: http://keycloak:8080/realms/agloom/protocol/openid-connect/certs
      OIDC_ALGORITHMS: RS256
      STUDIO_CORS_ORIGINS: http://localhost:5178
      STUDIO_REQUIRE_SEPARATE_APPROVER: ${STUDIO_REQUIRE_SEPARATE_APPROVER:-false}
    ports: ["127.0.0.1:8005:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak-bootstrap: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}
    networks:
      default: {}
      observability: {aliases: [autonomous-product-studio-api]}
  worker:
    build:
      context: ../..
      dockerfile: examples/autonomous_product_studio/backend/Containerfile
    command: ["python", "-m", "backend.worker"]
    environment:
      HOME: /tmp
      DATABASE_URL: "postgresql://agloom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/product_studio"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: all-minilm
      TARGET_PREVIEW_URL: http://target-preview
      PLAYWRIGHT_EXECUTABLE_PATH: /usr/local/bin/agloom-chromium
      VALIDATION_EXECUTOR_URL: http://validation-executor:8080
      EXPLABS_API_KEY: ${EXPLABS_API_KEY:?Set EXPLABS_API_KEY}
      EXPLABS_BASE_URL: ${EXPLABS_BASE_URL:-https://api.experientiallabs.ai/v1}
      EXPLABS_MODEL: ${EXPLABS_MODEL:-gpt-5.6-luna}
      STUDIO_WORKER_CONCURRENCY: ${STUDIO_WORKER_CONCURRENCY:-2}
      STUDIO_SHUTDOWN_GRACE_SECONDS: 45
      AGLOOM_OBSERVABILITY_ENABLED: "true"
      AGLOOM_METRICS_HOST: 0.0.0.0
      AGLOOM_METRICS_PORT: 9469
      AGLOOM_LANGFUSE_ENABLED: ${AGLOOM_LANGFUSE_ENABLED:-false}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGGRAPH_STRICT_MSGPACK: "true"
    stop_grace_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}
      target-preview: {condition: service_started}
      validation-executor: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - studio-workspace:/workspace/examples/autonomous_product_studio/workspace/projects
    networks:
      default: {}
      observability: {aliases: [autonomous-product-studio-worker]}
      validation-sandbox: {}
  validation-executor:
    build:
      context: ../..
      dockerfile: examples/autonomous_product_studio/backend/Containerfile
      target: validation-executor
    read_only: true
    tmpfs: ["/tmp", "/validation-runs:rw,nosuid,nodev,size=256m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      validation-sandbox: {}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build:
      context: ../..
      dockerfile: examples/autonomous_product_studio/frontend/Containerfile
      args:
        VITE_OIDC_URL: http://localhost:8088
        VITE_OIDC_REALM: agloom
        VITE_OIDC_CLIENT_ID: product-studio
    ports: ["127.0.0.1:5178:80"]
    depends_on: [backend, worker]
volumes:
  studio-postgres:
  studio-ollama:
  studio-workspace:
networks:
  validation-sandbox:
    internal: true
  observability:
    external: true
    name: agloom-observability_default
