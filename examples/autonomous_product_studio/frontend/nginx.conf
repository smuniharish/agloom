server {
  listen 80;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
