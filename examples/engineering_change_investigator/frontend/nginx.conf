server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://backend:8000;
        # Longer than INVESTIGATION_TIMEOUT_SECONDS, so the API reports timeouts.
        proxy_read_timeout 300s;
    }
    location / {
        try_files $uri /index.html;
    }
}
