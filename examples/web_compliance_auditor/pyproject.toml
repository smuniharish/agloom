[project]
name = "agloom-web-compliance-auditor"
version = "0.1.0"
description = "Grounded web compliance audits with Agloom, MCP evidence, and a policy-governed compliance register."
requires-python = ">=3.12"
dependencies = [
  "agentbarrier>=1.1.0,<2",
  "agloom[postgres-binary]",
  "behaviorweave>=1.0.0,<2",
  "contextsage>=1.0.0,<2",
  "fastapi>=0.142.2,<1",
  "feedback-manager>=0.1.1,<0.2",
  "langchain-core>=1.6.6,<2",
  "langchain-ollama>=1.1.0,<2",
  "langchain-openai>=1.6.7,<2",
  "mcp-capability-router>=0.2.0,<0.3",
  "pgvector>=0.5.0,<1",
  "prometheus-client>=0.26.0,<1",
  "psycopg[pool]>=3.3.6,<4",
  "pydantic>=2.13.5,<3",
  "refresh-engine>=0.2.0,<0.3",
  "uvicorn[standard]>=0.54.0,<1",
  "xstructured>=0.1.1,<0.2",
]

[dependency-groups]
dev = [
  "fastmcp>=4.0.11,<5",
  "httpx>=0.28.1,<1",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-timeout>=2.4.0,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
agloom = { path = "../..", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
timeout = 180
markers = [
  "postgres: requires PostgreSQL with pgvector (set COMPLIANCE_TEST_DATABASE_URL)",
]
filterwarnings = [
  "error::DeprecationWarning",
  "error::PendingDeprecationWarning",
  "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
]