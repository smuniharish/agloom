[project]
name = "agloom-continuous-evidence-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "agloom[postgres-binary]",
  "alembic>=1.20.0,<2",
  "fastapi>=0.142.2,<1",
  "httpx>=0.28.1,<1",
  "langchain-openai>=1.6.7,<2",
  "pgvector>=0.5.0,<1",
  "procrastinate>=3.10.0,<4",
  "prometheus-client>=0.26.0,<1",
  "psycopg[pool]>=3.3.6,<4",
  "pyjwt[crypto]>=2.15.1,<3",
  "sqlalchemy>=2.1.3,<3",
  "uvicorn[standard]>=0.54.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-timeout>=2.4.0,<3",
  "python-dotenv>=1.2.4,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
agloom = { path = "../..", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
timeout = 300
markers = [
  "postgres: needs PostgreSQL with pgvector (TEST_DATABASE_URL or a local Docker image)",
  "live: drives the real model and MCP servers; needs EVIDENCE_LIVE_TESTS=1",
]
filterwarnings = [
  "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
]
