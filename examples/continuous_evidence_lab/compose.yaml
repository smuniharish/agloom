services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    ports: ["127.0.0.1:8088:8080"]
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.8
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      OIDC_DEMO_USERNAME: ${OIDC_DEMO_USERNAME:?Set OIDC_DEMO_USERNAME}
      OIDC_DEMO_PASSWORD: ${OIDC_DEMO_PASSWORD:?Set OIDC_DEMO_PASSWORD}
      OIDC_DEMO_TENANT: ${OIDC_DEMO_TENANT:?Set OIDC_DEMO_TENANT}
    volumes: ["../keycloak:/bootstrap:ro"]
    depends_on: [keycloak]
  ollama:
    image: ollama/ollama:0.34.4
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & pid=$$!; sleep 3; ollama pull all-minilm; wait $$pid"]
    healthcheck:
      test: ["CMD", "ollama", "show", "all-minilm"]
      interval: 5s
      timeout: 5s
      retries: 60
    volumes: [ollama_data:/root/.ollama]
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: evidence
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:55437:5432"]
    # PostgreSQL 18 images keep their data in /var/lib/postgresql/18/docker.
    volumes: [postgresql_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidence"]
      interval: 5s
      timeout: 3s
      retries: 30
  target-site:
    image: nginx:1.30-alpine
    volumes: ["./target:/usr/share/nginx/html:ro"]
    networks: [browser-egress]
  browser:
    build:
      context: ../..
      dockerfile: examples/continuous_evidence_lab/browser.Containerfile
    environment:
      BROWSER_BRIDGE_TOKEN: ${BROWSER_BRIDGE_TOKEN:?Set a random 32+ character BROWSER_BRIDGE_TOKEN}
      HOME: /tmp/browser
    depends_on:
      target-site: {condition: service_started}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    # Chromium's sandbox chroots inside its user namespace; nothing else is added.
    cap_add: ["SYS_CHROOT"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8931),2); s.close()"
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      browser-control: {}
      browser-egress: {}
  backend:
    build: {context: ../.., dockerfile: examples/continuous_evidence_lab/backend.Containerfile}
    environment:
      DATABASE_URL: "postgresql://evidence:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/evidence"
      OBSERVABILITY_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9470
      REQUIRE_SEPARATE_APPROVER: ${REQUIRE_SEPARATE_APPROVER:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5180}
      OIDC_ISSUER: http://localhost:8088/realms/agloom
      OIDC_AUDIENCE: evidence-lab
      OIDC_JWKS_URI: http://keycloak:8080/realms/agloom/protocol/openid-connect/certs
      OIDC_ALGORITHMS: RS256
    depends_on:
      migrate: {condition: service_completed_successfully}
      keycloak-bootstrap: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8007:8007"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/api/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      default: {}
      observability: {aliases: [continuous-evidence-lab-api]}
  worker:
    build: {context: ../.., dockerfile: examples/continuous_evidence_lab/backend.Containerfile}
    command: ["python", "-m", "backend.worker"]
    environment:
      DATABASE_URL: "postgresql://evidence:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/evidence"
      EXPLABS_API_KEY: ${EXPLABS_API_KEY:?Set EXPLABS_API_KEY}
      EXPLABS_BASE_URL: ${EXPLABS_BASE_URL:-https://api.experientiallabs.ai/v1}
      EXPLABS_MODEL: ${EXPLABS_MODEL:-gpt-5.6-luna}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: all-minilm
      OBSERVABILITY_ENABLED: "true"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: 9470
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      STALLED_JOB_SECONDS: ${STALLED_JOB_SECONDS:-60}
      LANGGRAPH_STRICT_MSGPACK: "true"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse-web:3000}
      BROWSER_BRIDGE_HOST: browser
      BROWSER_BRIDGE_PORT: "8931"
      BROWSER_BRIDGE_TOKEN: ${BROWSER_BRIDGE_TOKEN:?Set a random 32+ character BROWSER_BRIDGE_TOKEN}
    depends_on:
      migrate: {condition: service_completed_successfully}
      ollama: {condition: service_healthy}
      browser: {condition: service_healthy}
    stop_grace_period: 45s
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      default: {}
      browser-control: {}
      observability: {aliases: [continuous-evidence-lab-worker]}
  frontend:
    build:
      context: ../..
      dockerfile: examples/continuous_evidence_lab/frontend.Containerfile
      args:
        VITE_OIDC_URL: http://localhost:8088
        VITE_OIDC_REALM: agloom
        VITE_OIDC_CLIENT_ID: evidence-lab
    depends_on: [backend, worker]
    ports: ["127.0.0.1:5180:80"]
  migrate:
    build: {context: ../.., dockerfile: examples/continuous_evidence_lab/backend.Containerfile}
    command: ["python", "-m", "backend.setup_database"]
    environment:
      DATABASE_URL: "postgresql://evidence:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/evidence"
      BACKFILL_TENANT_ID: ${BACKFILL_TENANT_ID:-}
      BACKFILL_USER_ID: ${BACKFILL_USER_ID:-}
    depends_on:
      db: {condition: service_healthy}
volumes:
  postgresql_data: {}
  ollama_data: {}
networks:
  browser-control:
    internal: true
  browser-egress: {}
  observability:
    external: true
    name: agloom-observability_default