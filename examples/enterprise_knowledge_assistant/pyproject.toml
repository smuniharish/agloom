[project]
name = "agloom-enterprise-knowledge-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agloom",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25",
]

[tool.uv]
package = false

[tool.uv.sources]
agloom = { path = "../..", editable = true }
