[project]
name = "agloom-rca-generator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agloom",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
agloom = { path = "../..", editable = true }
