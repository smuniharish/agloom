site_name: Agloom
site_description: Production-grade Python agent harness that automatically classifies tasks, optimizes execution, and scales orchestration across eight specialized topologies.
site_url: https://agloom.readthedocs.io/en/latest/
repo_name: agloom
repo_url: https://github.com/smuniharish/agloom
docs_dir: docs
site_dir: site
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_source: false
            inherited_members: false
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
      - Why Agloom?: guides/why-agloom.md
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - Examples and verified results: examples/overview.md
      - Agent Skills: agent-skills.md
  - Concepts:
      - Topologies: concepts/topologies.md
      - Recursion: concepts/recursion.md
      - Capabilities: concepts/capabilities.md
      - Observability: concepts/observability.md
      - Runtime and HITL: concepts/runtime.md
  - Guides:
      - Choosing an execution mode: guides/execution.md
      - Configuration: guides/configuration.md
      - Production runtime: guides/production.md
  - API reference:
      - create_agent: api/create-agent.md
      - Agent: api/agent.md
      - Configuration types: api/configuration.md
      - Capabilities: api/capabilities.md
      - Observability: api/observability.md
      - Errors: api/errors.md
