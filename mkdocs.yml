site_name: Agloom
site_description: >-
  Production-grade agent harness for LangChain and LangGraph: task-aware
  execution across eight topologies, policy-governed tools, and Loop Engineering.
site_author: S Muni Harish
site_url: https://agloom.readthedocs.io/en/latest/
repo_name: smuniharish/agloom
repo_url: https://github.com/smuniharish/agloom
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 S Muni Harish &middot; Apache License 2.0
docs_dir: docs
site_dir: site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Follow the system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/smuniharish/agloom
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agloom/

watch:
  - src
  - examples

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            filters: ["!^_"]
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - !relative $config_dir
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Why Agloom: getting-started/why-agloom.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Agloom and Deep Agents: getting-started/deep-agents.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Execution selection: concepts/execution-selection.md
      - Topologies: concepts/topologies.md
      - Capabilities and MCP: concepts/capabilities.md
      - Policies and approvals: concepts/policies.md
      - Loop Engineering: concepts/loop-engineering.md
      - Integrations via LangChain middleware: concepts/middleware.md
      - Execution limits and recursion: concepts/limits.md
      - Observability: concepts/observability.md
      - Errors: concepts/errors.md
  - Guides:
      - Configuration: guides/configuration.md
      - Writing policies: guides/writing-policies.md
      - Loops: guides/loops.md
      - Streaming: guides/streaming.md
      - Human-in-the-loop and resume: guides/human-in-the-loop.md
      - Structured output: guides/structured-output.md
      - Production deployment: guides/production.md
      - Testing agents: guides/testing.md
  - Examples: examples/overview.md
  - API reference:
      - Agent: api/agent.md
      - Models: api/models.md
      - Policy: api/policy.md
      - Loop Engineering: api/loop.md
      - Capabilities: api/capabilities.md
      - Observability: api/observability.md
      - Errors: api/errors.md
  - Agent Skills: agent-skills.md
  - Changelog: changelog.md